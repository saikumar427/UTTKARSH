    <div class="header-inner">
      <a href="#home" class="brand-link" data-nav="home" aria-label="Uttkarsh English High School Home">

          height="54"

          src="assets/images/canva/wordmark_header.png"

          class="brand-wordmark"
          width="124"
          height="44"

        class="mobile-menu-btn"

        aria-controls="primary-top-nav"

        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round">

        <a href="#home" class="nav-pill active" data-nav="home" aria-current="page">Home</a>
        <a href="#about-us" class="nav-pill" data-nav="about-us">About Us</a>

  <!-- Dynamic Page Content Container -->

    <section id="page-home" class="page-view active" data-page="home"></section>
    <section id="page-about-us" class="page-view" data-page="about-us" hidden></section>

    <div class="container">
      <section
        id="common-social-mount"
