  <script>
    // GitHub Pages SPA redirect: redirect all 404s to index.html with the path as a hash
    var path = window.location.pathname;
    var hash = window.location.hash;
    // If the path is not the root, redirect to root with hash
    if (path && path !== '/' && path !== '/index.html') {
      window.location.replace('/' + (hash || '#home'));
    } else {
      window.location.replace('/' + (hash || '#home'));
    }
  </script>
